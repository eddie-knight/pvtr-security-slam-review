loglevel: info # increase to trace for more verbose output
write-directory: evaluation_results
write: true # Change to false if you don't want to write the results to disk
output: yaml # Change to json if you want CLI and written output in json format
services:
  <service_name>: # unique name/id for the evaluation
    plugin: security-slam # required while running via Privateer
    policy:
      catalogs:
        - security-slam-fall-2026
      applicability: # the badges the project submitted; unlisted badges are skipped (NotRun), not failed
        - cleaner
        - chronicler
        - mechanizer
        - inspector
        - defender
        - cra-readiness
    vars:
      owner: <github org or user name>
      repo: <github repo name>
      token: <github token with public repo read access>
      maturity_level: 1 # the project's OSPS Baseline maturity level (1-3); Chronicler and Defender check controls at this level. Required when either is in applicability: the target fails to load without it
      grc_store_target: <namespace>/<target> # Defender: the grc.store target the project publishes to
      # Optional: the AI review steps. Without these, AI steps return Needs Review.
      ai_provider: anthropic
      ai_model: claude-sonnet-5-5
      ai_api_key: <anthropic api key>
      # Optional: ai_max_tokens (default 4096) and ai_timeout (default 120s).
      # Optional: grc_store_url: https://hub.grc.store
